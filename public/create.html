<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>创建房间 - 飞行棋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .btn { transition: all 0.2s; touch-action: manipulation; }
    .btn:active { transform: scale(0.96); }
    input, select {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: white;
      width: 100%;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #533483; }
  </style>
</head>
<body class="text-white">
  <div class="min-h-screen p-4">
    <div class="max-w-md mx-auto">
      <a href="index.html" class="btn text-gray-400 hover:text-white mb-4 flex items-center gap-2">
        <span>←</span> 返回首页
      </a>

      <div class="bg-gray-800/50 rounded-2xl p-6 border border-gray-700">
        <h2 class="text-2xl font-semibold mb-2 text-center" id="mode-title">创建房间</h2>
        <p class="text-gray-400 text-center text-sm mb-6" id="mode-desc">设置房间参数</p>

        <div class="space-y-4">
          <div>
            <label class="block text-gray-400 mb-2 text-sm">你的昵称</label>
            <input type="text" id="player-name" placeholder="输入昵称" maxlength="20" />
          </div>

          <div>
            <label class="block text-gray-400 mb-2 text-sm">房间密码 (6-10位字母+数字)</label>
            <input type="password" id="room-password" placeholder="自定义密码 (可选)" maxlength="20" />
            <p class="text-xs text-gray-500 mt-1">密码为空则不设置密码</p>
          </div>

          <div>
            <label class="block text-gray-400 mb-2 text-sm">游戏难度</label>
            <select id="difficulty-select">
              <option value="easy">🟢 休闲模式（任务简单，朋友聚会）</option>
              <option value="normal" selected>🟡 团建模式（均衡难度，团队竞技）</option>
              <option value="hard">🔴 竞技模式（高难度挑战，对抗竞技）</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-400 mb-2 text-sm">回合时长</label>
            <select id="turn-duration-select">
              <option value="15">15秒（快节奏）</option>
              <option value="30">30秒</option>
              <option value="45" selected>45秒（默认）</option>
              <option value="60">60秒（从容）</option>
              <option value="90">90秒（休闲）</option>
              <option value="120">120秒（慢节奏）</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-400 mb-2 text-sm">最大人数</label>
            <select id="max-players-select">
              <option value="2">2人</option>
              <option value="3">3人</option>
              <option value="4" selected>4人（推荐）</option>
              <option value="5">5人</option>
              <option value="6">6人</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-400 mb-2 text-sm">房间可见性</label>
            <div class="flex gap-4 mt-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="is-public" value="true" checked class="w-5 h-5 accent-purple-500" />
                <span>🌐 公开房间</span>
                <span class="text-xs text-gray-500">(显示在房间列表)</span>
              </label>
            </div>
            <div class="flex gap-4 mt-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="is-public" value="false" class="w-5 h-5 accent-purple-500" />
                <span>🔒 私密房间</span>
                <span class="text-xs text-gray-500">(不在列表显示)</span>
              </label>
            </div>
          </div>

          <button onclick="createRoom()" class="btn w-full bg-green-600 hover:bg-green-700 py-4 rounded-xl text-lg font-semibold mt-4">
            🎮 创建房间
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 错误提示 -->
  <div id="error-toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-lg hidden z-50">
    <span id="error-message"></span>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-500 border-t-transparent"></div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    // 获取URL参数
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'multi';

    // 设置页面标题
    if (mode === 'couple') {
      document.getElementById('mode-title').textContent = '💑 创建情侣房间';
      document.getElementById('mode-desc').textContent = '仅限2人，开启私密对战';
      // 情侣模式强制2人
      const maxSel = document.getElementById('max-players-select');
      maxSel.innerHTML = '<option value="2" selected>2人</option>';
      maxSel.disabled = true;
    } else {
      document.getElementById('mode-title').textContent = '👥 创建多人房间';
      document.getElementById('mode-desc').textContent = '2-6人，欢乐对战';
    }

    // Socket连接
    let socket = null;
    let selectedColor = 'red';

    function init() {
      socket = io(window.location.origin, { transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        console.log('已连接服务器');
      });

      socket.on('room_created', (data) => {
        hideLoading();
        // 跳转到等待室
        window.location.href = `waiting.html?room=${data.roomCode}&player=${data.playerId}`;
      });

      socket.on('error', (data) => {
        hideLoading();
        showError(data.message || '操作失败');
      });
    }

    function showLoading() {
      document.getElementById('loading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      document.getElementById('error-message').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function validatePassword(pwd) {
      if (!pwd || pwd.length === 0) return { valid: true };
      if (pwd.length < 6 || pwd.length > 10) {
        return { valid: false, error: '密码必须为6-10位' };
      }
      if (!/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd)) {
        return { valid: false, error: '密码必须包含字母和数字' };
      }
      if (!/^[a-zA-Z0-9]+$/.test(pwd)) {
        return { valid: false, error: '密码只能包含字母和数字' };
      }
      return { valid: true };
    }

    function createRoom() {
      const playerName = document.getElementById('player-name').value.trim();
      if (!playerName) { showError('请输入昵称'); return; }
      if (playerName.length > 20) { showError('昵称不能超过20字'); return; }

      const password = document.getElementById('room-password').value;
      const pwdCheck = validatePassword(password);
      if (!pwdCheck.valid) { showError(pwdCheck.error); return; }

      const difficulty = document.getElementById('difficulty-select').value;
      const turnDuration = parseInt(document.getElementById('turn-duration-select').value);
      let maxPlayers = parseInt(document.getElementById('max-players-select').value);
      const isPublic = document.querySelector('input[name="is-public"]:checked').value === 'true';

      // 情侣模式强制2人
      if (mode === 'couple') maxPlayers = 2;

      showLoading();

      // 发送到服务器
      socket.emit('create_room', {
        mode: mode,
        playerName: playerName,
        password: password || null,
        options: {
          maxPlayers: maxPlayers,
          turnDuration: turnDuration,
          difficulty: difficulty,
          pieceColor: selectedColor,
          isPublic: isPublic
        }
      });
    }

    // 加载昵称
    const savedName = localStorage.getItem('playerName');
    if (savedName) document.getElementById('player-name').value = savedName;
    document.getElementById('player-name').addEventListener('change', (e) => {
      localStorage.setItem('playerName', e.target.value);
    });

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飞行棋 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .btn { transition: all 0.2s; touch-action: manipulation; }
    .btn:active { transform: scale(0.96); }
    input, select {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: white;
      width: 100%;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #533483; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .room-card { transition: transform 0.2s; }
    .room-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="text-white">
  <div class="min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
      <!-- 标题 -->
      <div class="text-center mb-6">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 bg-clip-text text-transparent">
          飞行棋
        </h1>
        <p class="text-gray-400 text-lg">联机版 - 与朋友一起玩</p>
      </div>

      <!-- 昵称输入 -->
      <div class="mb-4">
        <input type="text" id="player-name" placeholder="输入你的昵称" maxlength="20" />
      </div>

      <!-- 公开房间列表 -->
      <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700 mb-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-semibold">🌐 公开房间</h2>
          <button onclick="loadPublicRooms()" class="btn text-sm text-gray-400 hover:text-white">
            🔄 刷新
          </button>
        </div>
        <div id="room-list" class="space-y-2 max-h-[40vh] overflow-auto">
          <div class="text-center text-gray-500 py-8">
            加载中...
          </div>
        </div>
      </div>

      <!-- 加入房间 -->
      <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700 mb-4">
        <h2 class="text-lg font-semibold mb-3">🔑 输入房间码加入</h2>
        <div class="space-y-3">
          <input type="text" id="join-room-code" placeholder="输入6位房间码" maxlength="6" class="text-center text-2xl tracking-widest uppercase" />
          <input type="password" id="join-room-password" placeholder="房间密码（如有）" maxlength="20" />
          <button onclick="joinByCode()" class="btn w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-lg font-semibold">
            加入房间
          </button>
        </div>
      </div>

      <!-- 模式选择 -->
      <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700 mb-4">
        <h2 class="text-lg font-semibold mb-3 text-center">🎮 创建房间</h2>
        <div class="grid grid-cols-2 gap-3">
          <a href="create.html?mode=couple" class="btn bg-pink-600 hover:bg-pink-700 py-4 px-4 rounded-xl text-center">
            <div class="text-2xl mb-1">💑</div>
            <div class="font-semibold">情侣私密</div>
            <div class="text-xs text-pink-200">2人密码房间</div>
          </a>
          <a href="create.html?mode=multi" class="btn bg-purple-600 hover:bg-purple-700 py-4 px-4 rounded-xl text-center">
            <div class="text-2xl mb-1">👥</div>
            <div class="font-semibold">好友多人</div>
            <div class="text-xs text-purple-200">2-6人自由加入</div>
          </a>
        </div>
      </div>

      <!-- 工具 -->
      <a href="editor.html" class="btn w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl text-gray-300 text-center block mb-4">
        📝 任务包编辑器
      </a>
    </div>
  </div>

  <!-- 密码弹窗 -->
  <div id="password-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-sm border border-gray-700">
      <h3 class="text-xl font-bold mb-4 text-center">🔐 该房间需要密码</h3>
      <p class="text-gray-400 text-center mb-4 text-sm" id="password-modal-info"></p>
      <input type="password" id="modal-password" placeholder="输入房间密码" maxlength="20" class="mb-4" />
      <div class="flex gap-3">
        <button onclick="closePasswordModal()" class="btn flex-1 bg-gray-700 py-3 rounded-xl">取消</button>
        <button onclick="confirmJoinWithPassword()" class="btn flex-1 bg-green-600 hover:bg-green-700 py-3 rounded-xl">加入</button>
      </div>
    </div>
  </div>

  <!-- 错误提示 -->
  <div id="error-toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-lg hidden z-50">
    <span id="error-message"></span>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-500 border-t-transparent"></div>
  </div>

  <script>
    // 状态
    let socket = null;
    let currentPlayerId = null;
    let currentRoomCode = null;
    let pendingJoinRoom = null;

    function init() {
      socket = io(window.location.origin, {
        transports: ['websocket', 'polling'],
        reconnection: true
      });

      socket.on('connect', () => {
        console.log('已连接服务器');
        loadPublicRooms();
      });

      socket.on('room_joined', (data) => {
        hideLoading();
        currentPlayerId = data.playerId;
        currentRoomCode = data.roomCode;
        window.location.href = `waiting.html?room=${data.roomCode}&player=${data.playerId}`;
      });

      socket.on('error', (data) => {
        hideLoading();
        showError(data.message || '操作失败');
      });

      // 加载昵称
      const savedName = localStorage.getItem('playerName');
      if (savedName) document.getElementById('player-name').value = savedName;
      document.getElementById('player-name').addEventListener('change', (e) => {
        localStorage.setItem('playerName', e.target.value);
      });
    }

    function loadPublicRooms() {
      fetch('/api/rooms/public')
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('room-list');
          if (data.success && data.rooms.length > 0) {
            list.innerHTML = data.rooms.map(room => {
              const diffLabel = { easy: '🟢', normal: '🟡', hard: '🔴' };
              const modeLabel = { couple: '💑', multi: '👥' };
              return `
                <div class="room-card bg-gray-900/50 rounded-xl p-3 cursor-pointer hover:bg-gray-700 border border-gray-700"
                     onclick="joinRoom('${room.code}', ${room.hasPassword})">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                      <span class="text-xl">${modeLabel[room.mode] || '👥'}</span>
                      <div>
                        <div class="font-semibold">房间 ${room.code}</div>
                        <div class="text-xs text-gray-400">
                          ${diffLabel[room.difficulty] || '🟡'} ${getDifficultyLabel(room.difficulty)}
                          · ${room.playerCount}/${room.maxPlayers}人
                        </div>
                      </div>
                    </div>
                    <div class="text-right">
                      ${room.hasPassword ? '<span class="text-yellow-400">🔒</span>' : '<span class="text-green-400">🟢</span>'}
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          } else {
            list.innerHTML = '<div class="text-center text-gray-500 py-8">暂无公开房间<br><span class="text-sm">创建一个吧！</span></div>';
          }
        })
        .catch(() => {
          document.getElementById('room-list').innerHTML = '<div class="text-center text-gray-500 py-8">加载失败</div>';
        });
    }

    function getDifficultyLabel(diff) {
      const map = { easy: '休闲', normal: '团建', hard: '竞技' };
      return map[diff] || '普通';
    }

    function joinRoom(roomCode, needsPassword) {
      const name = getPlayerName();
      if (!name) { showError('请先输入昵称'); return; }

      if (needsPassword) {
        // 显示密码输入弹窗
        pendingJoinRoom = { code: roomCode, name: name };
        document.getElementById('password-modal-info').textContent = `房间: ${roomCode}`;
        document.getElementById('modal-password').value = '';
        document.getElementById('password-modal').classList.remove('hidden');
      } else {
        doJoinRoom(roomCode, name, null);
      }
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.add('hidden');
      pendingJoinRoom = null;
    }

    function confirmJoinWithPassword() {
      const password = document.getElementById('modal-password').value;
      if (!pendingJoinRoom) return;
      doJoinRoom(pendingJoinRoom.code, pendingJoinRoom.name, password);
      closePasswordModal();
    }

    function doJoinRoom(roomCode, playerName, password) {
      showLoading();
      socket.emit('join_room', {
        roomCode: roomCode,
        playerName: playerName,
        password: password || null
      });
    }

    function joinByCode() {
      const name = getPlayerName();
      if (!name) { showError('请先输入昵称'); return; }

      const code = document.getElementById('join-room-code').value.trim().toUpperCase();
      if (!code) { showError('请输入房间码'); return; }

      const password = document.getElementById('join-room-password').value;
      showLoading();
      socket.emit('join_room', { roomCode: code, playerName: name, password: password || null });
    }

    function getPlayerName() {
      return document.getElementById('player-name').value.trim();
    }

    function showLoading() {
      document.getElementById('loading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      document.getElementById('error-message').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    // 回车键快速加入
    document.getElementById('join-room-code').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinByCode();
    });

    document.getElementById('modal-password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') confirmJoinWithPassword();
    });

    // 初始加载
    init();
  </script>
</body>
</html>

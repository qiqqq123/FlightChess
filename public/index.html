<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飞行棋 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .btn { transition: all 0.2s; touch-action: manipulation; }
    .btn:active { transform: scale(0.96); }
    input, select {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: white;
      width: 100%;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #533483; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="text-white">
  <div class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center mb-8">
      <h1 class="text-4xl md:text-6xl font-bold mb-2 bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 bg-clip-text text-transparent">
        飞行棋
      </h1>
      <p class="text-gray-400 text-lg">联机版 - 与朋友一起玩</p>
    </div>

    <div class="w-full max-w-md space-y-4">
      <!-- 模式选择 -->
      <div class="bg-gray-800/50 rounded-2xl p-6 border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-center">选择游戏模式</h2>
        <div class="grid grid-cols-2 gap-4">
          <a href="create.html?mode=couple" class="btn bg-pink-600 hover:bg-pink-700 py-4 px-6 rounded-xl text-lg font-semibold flex flex-col items-center gap-2 text-center">
            <span class="text-2xl">💑</span>
            <span>情侣私密</span>
            <span class="text-xs text-pink-200">2人密码房间</span>
          </a>
          <a href="create.html?mode=multi" class="btn bg-purple-600 hover:bg-purple-700 py-4 px-6 rounded-xl text-lg font-semibold flex flex-col items-center gap-2 text-center">
            <span class="text-2xl">👥</span>
            <span>好友多人</span>
            <span class="text-xs text-purple-200">2-6人自由加入</span>
          </a>
        </div>
      </div>

      <!-- 加入房间 -->
      <div class="bg-gray-800/50 rounded-2xl p-6 border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-center">加入房间</h2>
        <div class="space-y-3">
          <input type="text" id="join-player-name" placeholder="你的昵称" maxlength="20" />
          <input type="text" id="join-room-code" placeholder="输入房间码" maxlength="6" class="text-center text-2xl tracking-widest uppercase" />
          <input type="password" id="join-room-password" placeholder="房间密码（如有）" maxlength="20" />
          <button onclick="joinByCode()" class="btn w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-lg font-semibold">
            加入房间
          </button>
          <div class="text-center text-gray-400">或</div>
          <input type="text" id="join-short-code" placeholder="输入短码" maxlength="9" class="text-center tracking-widest uppercase" />
          <button onclick="joinByShortCode()" class="btn w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl text-lg font-semibold">
            短码加入
          </button>
        </div>
      </div>

      <a href="editor.html" class="btn w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl text-gray-300 text-center block">
        📝 任务包编辑器
      </a>
    </div>
  </div>

  <!-- 错误提示 -->
  <div id="error-toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-lg hidden">
    <span id="error-message"></span>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-500 border-t-transparent"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/socket.js"></script>
  <script>
    // 页面状态
    let socket = null;
    let currentPlayerId = null;
    let currentRoomCode = null;

    function init() {
      socket = io(window.location.origin, {
        transports: ['websocket', 'polling'],
        reconnection: true
      });

      socket.on('connect', () => {
        console.log('已连接服务器');
      });

      socket.on('room_joined', (data) => {
        hideLoading();
        currentPlayerId = data.playerId;
        currentRoomCode = data.roomCode;
        // 跳转到等待室
        window.location.href = `waiting.html?room=${data.roomCode}&player=${data.playerId}`;
      });

      socket.on('error', (data) => {
        hideLoading();
        showError(data.message || '操作失败');
      });
    }

    function showLoading() {
      document.getElementById('loading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      document.getElementById('error-message').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function getPlayerName() {
      return document.getElementById('join-player-name').value.trim();
    }

    function joinByCode() {
      const name = getPlayerName();
      if (!name) { showError('请输入昵称'); return; }

      const code = document.getElementById('join-room-code').value.trim().toUpperCase();
      if (!code) { showError('请输入房间码'); return; }

      const password = document.getElementById('join-room-password').value;
      showLoading();
      socket.emit('join_room', { roomCode: code, playerName: name, password: password || null });
    }

    function joinByShortCode() {
      const name = getPlayerName();
      if (!name) { showError('请输入昵称'); return; }

      const shortCode = document.getElementById('join-short-code').value.trim().toUpperCase();
      if (!shortCode) { showError('请输入短码'); return; }

      const password = document.getElementById('join-room-password').value;
      showLoading();
      socket.emit('join_room_short', { shortCode, playerName: name, password: password || null });
    }

    // 昵称本地存储
    const savedName = localStorage.getItem('playerName');
    if (savedName) document.getElementById('join-player-name').value = savedName;

    document.getElementById('join-player-name').addEventListener('change', (e) => {
      localStorage.setItem('playerName', e.target.value);
    });

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飞行棋 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* 动态背景 */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }
    /* 玻璃卡片 */
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    .btn:hover::before {
      left: 100%;
    }
    .btn:active { transform: scale(0.96); }
    /* 输入框 */
    .input-field {
      background: rgba(15, 12, 41, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      width: 100%;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      background: rgba(15, 12, 41, 0.95);
    }
    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    /* 房间卡片 */
    .room-card {
      background: rgba(15, 12, 41, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .room-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 12px 40px rgba(168, 85, 247, 0.2);
    }
    /* 渐变文字 */
    .gradient-text {
      background: linear-gradient(135deg, #f97316, #eab308, #22c55e, #3b82f6, #a855f7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-shift 5s ease infinite;
    }
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    /* 弹窗动画 */
    .modal-overlay {
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      transform: scale(0.9) translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    /* 淡入动画 */
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-1 { animation-delay: 0.1s; opacity: 0; }
    .stagger-2 { animation-delay: 0.2s; opacity: 0; }
    .stagger-3 { animation-delay: 0.3s; opacity: 0; }
    .stagger-4 { animation-delay: 0.4s; opacity: 0; }
    /* 加载动画 */
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(168, 85, 247, 0.3);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Toast动画 */
    .toast {
      animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
    }
    @keyframes toast-in {
      from { transform: translateX(-50%) translateY(100%); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    @keyframes toast-out {
      from { transform: translateX(-50%) translateY(0); opacity: 1; }
      to { transform: translateX(-50%) translateY(100%); opacity: 0; }
    }
    /* 模式选择卡片 */
    .mode-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mode-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    .mode-card:hover::before {
      opacity: 1;
    }
    .mode-card:hover {
      transform: translateY(-6px) scale(1.03);
    }
    .mode-card.couple::before {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.8), rgba(168, 85, 247, 0.8));
    }
    .mode-card.multi::before {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.8), rgba(59, 130, 246, 0.8));
    }
    .mode-card > * {
      position: relative;
      z-index: 1;
    }
    .mode-icon {
      font-size: 3rem;
      margin-bottom: 8px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.5);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 85, 247, 0.8);
    }
  </style>
</head>
<body class="text-white">
  <!-- 动态背景粒子 -->
  <div class="bg-particles" id="particles"></div>

  <div class="min-h-screen p-4 relative z-10">
    <div class="max-w-2xl mx-auto">
      <!-- 标题 -->
      <div class="text-center mb-8 fade-in">
        <h1 class="text-5xl md:text-6xl font-black mb-3 gradient-text">
          飞行棋
        </h1>
        <p class="text-gray-300 text-lg">联机版 - 与朋友一起翱翔天际</p>
      </div>

      <!-- 昵称输入 -->
      <div class="mb-6 fade-in stagger-1">
        <div class="glass-card rounded-2xl p-4">
          <div class="flex items-center gap-3">
            <span class="text-2xl">👤</span>
            <input type="text" id="player-name" placeholder="输入你的昵称" maxlength="20" class="input-field" />
          </div>
        </div>
      </div>

      <!-- 公开房间列表 -->
      <div class="glass-card rounded-2xl p-5 mb-6 fade-in stagger-2">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span class="text-2xl">🌐</span> 公开房间
          </h2>
          <button onclick="loadPublicRooms()" class="btn text-sm text-purple-300 hover:text-white flex items-center gap-1 px-3 py-1.5 rounded-full bg-purple-500/20 hover:bg-purple-500/40 transition-all">
            <span>🔄</span> 刷新
          </button>
        </div>
        <div id="room-list" class="space-y-3 max-h-[35vh] overflow-auto pr-1">
          <div class="text-center text-gray-400 py-10">
            <div class="text-4xl mb-2">🎲</div>
            <div>正在加载房间...</div>
          </div>
        </div>
      </div>

      <!-- 加入房间 -->
      <div class="glass-card rounded-2xl p-5 mb-6 fade-in stagger-3">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
          <span class="text-2xl">🔑</span> 输入房间码加入
        </h2>
        <div class="space-y-3">
          <input type="text" id="join-room-code" placeholder="输入6位房间码" maxlength="6" class="input-field text-center text-2xl tracking-[0.5em] uppercase font-bold" />
          <input type="password" id="join-room-password" placeholder="房间密码（如有）" class="input-field" />
          <button onclick="joinByCode()" class="btn w-full py-4 rounded-xl text-lg font-bold bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 shadow-lg hover:shadow-purple-500/30">
            🚀 加入房间
          </button>
        </div>
      </div>

      <!-- 模式选择 -->
      <div class="mb-6 fade-in stagger-4">
        <h2 class="text-xl font-bold mb-4 text-center flex items-center justify-center gap-2">
          <span class="text-2xl">🎮</span> 创建房间
        </h2>
        <div class="grid grid-cols-2 gap-4">
          <a href="create.html?mode=couple" class="mode-card couple bg-gradient-to-br from-pink-600/80 to-purple-600/80">
            <span class="mode-icon">💑</span>
            <div class="font-bold text-lg mb-1">情侣私密</div>
            <div class="text-xs text-pink-100/80">2人密码房间</div>
          </a>
          <a href="create.html?mode=multi" class="mode-card multi bg-gradient-to-br from-purple-600/80 to-blue-600/80">
            <span class="mode-icon">👥</span>
            <div class="font-bold text-lg mb-1">好友多人</div>
            <div class="text-xs text-purple-100/80">2-6人自由加入</div>
          </a>
        </div>
      </div>

      <!-- 工具 -->
      <a href="editor.html" class="btn block glass-card rounded-2xl p-4 text-center mb-4 hover:border-purple-500/50 transition-all fade-in stagger-4">
        <span class="text-xl mr-2">📝</span>
        <span class="font-semibold">任务包编辑器</span>
      </a>
    </div>
  </div>

  <!-- 密码弹窗 -->
  <div id="password-modal" class="modal-overlay fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="modal-content glass-card rounded-3xl p-6 w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="text-5xl block mb-3">🔐</span>
        <h3 class="text-2xl font-bold">该房间需要密码</h3>
        <p class="text-gray-400 text-sm mt-2" id="password-modal-info"></p>
      </div>
      <input type="password" id="modal-password" placeholder="输入房间密码" maxlength="20" class="input-field mb-4" />
      <div class="flex gap-3">
        <button onclick="closePasswordModal()" class="btn flex-1 py-3 rounded-xl bg-gray-700/80 hover:bg-gray-600 font-semibold">取消</button>
        <button onclick="confirmJoinWithPassword()" class="btn flex-1 py-3 rounded-xl bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 font-semibold">加入</button>
      </div>
    </div>
  </div>

  <!-- 错误提示 -->
  <div id="error-toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 hidden z-50">
    <div class="toast bg-gradient-to-r from-red-600 to-rose-600 text-white px-6 py-3 rounded-full shadow-2xl font-semibold">
      <span id="error-message"></span>
    </div>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
    <div class="text-center">
      <div class="loading-spinner mx-auto mb-4"></div>
      <div class="text-lg font-semibold text-purple-300">连接中...</div>
    </div>
  </div>

  <script>
    // 生成背景粒子
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        container.appendChild(particle);
      }
    }
    createParticles();

    // 状态
    let socket = null;
    let currentPlayerId = null;
    let currentRoomCode = null;
    let pendingJoinRoom = null;

    function init() {
      socket = io(window.location.origin, {
        transports: ['websocket', 'polling'],
        reconnection: true
      });

      socket.on('connect', () => {
        console.log('已连接服务器');
        loadPublicRooms();
      });

      socket.on('room_joined', (data) => {
        hideLoading();
        currentPlayerId = data.playerId;
        currentRoomCode = data.roomCode;
        window.location.href = `waiting.html?room=${data.roomCode}&player=${data.playerId}`;
      });

      socket.on('error', (data) => {
        hideLoading();
        showError(data.message || '操作失败');
      });

      // 加载昵称
      const savedName = localStorage.getItem('playerName');
      if (savedName) document.getElementById('player-name').value = savedName;
      document.getElementById('player-name').addEventListener('change', (e) => {
        localStorage.setItem('playerName', e.target.value);
      });
    }

    function loadPublicRooms() {
      fetch('/api/rooms/public')
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('room-list');
          if (data.success && data.rooms.length > 0) {
            list.innerHTML = data.rooms.map(room => {
              const diffLabel = { easy: '🟢', normal: '🟡', hard: '🔴' };
              const modeLabel = { couple: '💑', multi: '👥' };
              const diffColors = { easy: 'text-green-400', normal: 'text-yellow-400', hard: 'text-red-400' };
              return `
                <div class="room-card" onclick="joinRoom('${room.code}', ${room.hasPassword})">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                      <span class="text-3xl">${modeLabel[room.mode] || '👥'}</span>
                      <div>
                        <div class="font-bold text-lg">房间 ${room.code}</div>
                        <div class="text-sm text-gray-400 flex items-center gap-2">
                          <span class="${diffColors[room.difficulty]}">${diffLabel[room.difficulty] || '🟡'}</span>
                          <span>·</span>
                          <span>${getDifficultyLabel(room.difficulty)}</span>
                          <span>·</span>
                          <span>${room.playerCount}/${room.maxPlayers}人</span>
                        </div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2">
                      ${room.hasPassword ? '<span class="text-yellow-400 text-xl">🔒</span>' : '<span class="text-green-400 text-xl">🟢</span>'}
                      <span class="text-gray-500">›</span>
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          } else {
            list.innerHTML = `
              <div class="text-center text-gray-400 py-12">
                <div class="text-5xl mb-4">🎲</div>
                <div class="text-lg mb-1">暂无公开房间</div>
                <div class="text-sm text-gray-500">创建一个吧！</div>
              </div>
            `;
          }
        })
        .catch(() => {
          document.getElementById('room-list').innerHTML = `
            <div class="text-center text-gray-400 py-12">
              <div class="text-4xl mb-2">⚠️</div>
              <div>加载失败</div>
            </div>
          `;
        });
    }

    function getDifficultyLabel(diff) {
      const map = { easy: '休闲', normal: '团建', hard: '竞技' };
      return map[diff] || '普通';
    }

    function joinRoom(roomCode, needsPassword) {
      const name = getPlayerName();
      if (!name) { showError('请先输入昵称'); return; }

      if (needsPassword) {
        pendingJoinRoom = { code: roomCode, name: name };
        document.getElementById('password-modal-info').textContent = `房间: ${roomCode}`;
        document.getElementById('modal-password').value = '';
        document.getElementById('password-modal').classList.add('active');
      } else {
        doJoinRoom(roomCode, name, null);
      }
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.remove('active');
      pendingJoinRoom = null;
    }

    function confirmJoinWithPassword() {
      const password = document.getElementById('modal-password').value;
      if (!pendingJoinRoom) return;
      doJoinRoom(pendingJoinRoom.code, pendingJoinRoom.name, password);
      closePasswordModal();
    }

    function doJoinRoom(roomCode, playerName, password) {
      showLoading();
      socket.emit('join_room', {
        roomCode: roomCode,
        playerName: playerName,
        password: password || null
      });
    }

    function joinByCode() {
      const name = getPlayerName();
      if (!name) { showError('请先输入昵称'); return; }

      const code = document.getElementById('join-room-code').value.trim().toUpperCase();
      if (!code) { showError('请输入房间码'); return; }

      const password = document.getElementById('join-room-password').value;
      showLoading();
      socket.emit('join_room', { roomCode: code, playerName: name, password: password || null });
    }

    function getPlayerName() {
      return document.getElementById('player-name').value.trim();
    }

    function showLoading() {
      document.getElementById('loading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      document.getElementById('error-message').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    // 回车键快速加入
    document.getElementById('join-room-code').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinByCode();
    });

    document.getElementById('modal-password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') confirmJoinWithPassword();
    });

    // 点击弹窗背景关闭
    document.getElementById('password-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('password-modal')) {
        closePasswordModal();
      }
    });

    // 初始加载
    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>任务包编辑器 - 飞行棋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .btn { transition: all 0.2s; touch-action: manipulation; }
    .btn:active { transform: scale(0.96); }
    textarea, input, select {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: white;
      width: 100%;
      font-size: 0.9rem;
    }
    textarea:focus, input:focus, select:focus { outline: none; border-color: #533483; }
  </style>
</head>
<body class="text-white">
  <div class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
      <!-- 头部 -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">📝 任务包编辑器</h1>
        <a href="index.html" class="btn text-gray-400 hover:text-white">返回首页</a>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <!-- 左侧：任务包列表 -->
        <div class="md:col-span-1">
          <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700">
            <h3 class="font-semibold mb-3">任务包列表</h3>
            <div id="package-list" class="space-y-2 max-h-[40vh] overflow-auto mb-3"></div>
            <button onclick="createNewPackage()" class="btn w-full bg-green-600 py-2 rounded-lg">+ 新建任务包</button>
          </div>

          <div class="mt-4 space-y-2">
            <button onclick="showImport()" class="btn w-full bg-blue-600 py-2 rounded-lg">📥 导入JSON</button>
            <button onclick="exportCurrent()" class="btn w-full bg-purple-600 py-2 rounded-lg">📤 导出JSON</button>
          </div>
        </div>

        <!-- 右侧：编辑器 -->
        <div class="md:col-span-2">
          <div id="editor-panel" class="bg-gray-800/50 rounded-xl p-4 border border-gray-700">
            <div id="no-selection" class="text-center text-gray-400 py-12">
              选择或创建一个任务包开始编辑
            </div>

            <div id="editor-form" class="hidden space-y-4">
              <div class="flex gap-4">
                <div class="flex-1">
                  <label class="block text-gray-400 mb-1 text-sm">名称</label>
                  <input type="text" id="pkg-name" placeholder="任务包名称" />
                </div>
                <div class="w-32">
                  <label class="block text-gray-400 mb-1 text-sm">任务数量</label>
                  <input type="number" id="pkg-count" readonly class="bg-gray-700" />
                </div>
              </div>

              <div>
                <label class="block text-gray-400 mb-1 text-sm">作者</label>
                <input type="text" id="pkg-author" placeholder="作者名称" />
              </div>

              <div>
                <label class="block text-gray-400 mb-1 text-sm">描述</label>
                <textarea id="pkg-desc" rows="2" placeholder="任务包描述"></textarea>
              </div>

              <!-- 任务列表 -->
              <div>
                <div class="flex justify-between items-center mb-2">
                  <label class="text-gray-400 text-sm">任务列表</label>
                  <button onclick="addTask()" class="btn bg-blue-600 py-1 px-3 rounded text-sm">+ 添加任务</button>
                </div>
                <div id="task-list" class="space-y-2 max-h-[40vh] overflow-auto"></div>
              </div>

              <div class="flex gap-2">
                <button onclick="savePackage()" class="btn flex-1 bg-green-600 py-3 rounded-lg font-semibold">💾 保存</button>
                <button onclick="deletePackage()" class="btn bg-red-600 py-3 px-6 rounded-lg">删除</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 任务编辑弹窗 -->
  <div id="task-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-lg border border-gray-700">
      <h3 class="text-xl font-bold mb-4" id="task-modal-title">编辑任务</h3>

      <div class="space-y-4">
        <div>
          <label class="block text-gray-400 mb-1 text-sm">类型</label>
          <select id="task-type">
            <option value="question">问答题</option>
            <option value="action">动作题</option>
            <option value="challenge">挑战题</option>
            <option value="luck">运气题</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-400 mb-1 text-sm">内容/问题</label>
          <textarea id="task-content" rows="2" placeholder="输入问题或任务内容"></textarea>
        </div>

        <div id="options-section">
          <label class="block text-gray-400 mb-1 text-sm">选项 (用|分隔)</label>
          <input type="text" id="task-options" placeholder="选项A|选项B|选项C|选项D" />
        </div>

        <div id="answer-section">
          <label class="block text-gray-400 mb-1 text-sm">正确答案 (0=A, 1=B, ...)</label>
          <input type="number" id="task-answer" min="0" max="3" placeholder="0" />
        </div>

        <div id="desc-section" class="hidden">
          <label class="block text-gray-400 mb-1 text-sm">动作描述</label>
          <textarea id="task-desc" rows="2" placeholder="描述要完成的动作"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-400 mb-1 text-sm">奖励 (前进步数)</label>
            <input type="number" id="task-reward" value="2" />
          </div>
          <div>
            <label class="block text-gray-400 mb-1 text-sm">惩罚 (后退步数)</label>
            <input type="number" id="task-penalty" value="-2" />
          </div>
        </div>
      </div>

      <div class="flex gap-2 mt-6">
        <button onclick="saveTask()" class="btn flex-1 bg-green-600 py-2 rounded-lg">保存</button>
        <button onclick="closeTaskModal()" class="btn bg-gray-700 py-2 px-6 rounded-lg">取消</button>
      </div>
    </div>
  </div>

  <!-- 导入弹窗 -->
  <div id="import-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-lg border border-gray-700">
      <h3 class="text-xl font-bold mb-4">导入任务包JSON</h3>
      <textarea id="import-json" rows="10" placeholder="粘贴JSON内容..." class="font-mono text-sm"></textarea>
      <div class="flex gap-2 mt-4">
        <button onclick="doImport()" class="btn flex-1 bg-blue-600 py-2 rounded-lg">导入</button>
        <button onclick="closeImportModal()" class="btn bg-gray-700 py-2 px-6 rounded-lg">取消</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg hidden z-50"></div>

  <script>
    let packages = [];
    let currentPkg = null;
    let currentTaskIndex = null;

    async function loadPackages() {
      const res = await fetch('/api/task-packages');
      const data = await res.json();
      if (data.success) {
        packages = data.packages;
        renderPackageList();
      }
    }

    function renderPackageList() {
      const list = document.getElementById('package-list');
      list.innerHTML = packages.map((pkg, i) => `
        <div class="p-3 rounded-lg bg-gray-900 cursor-pointer hover:bg-gray-700 ${pkg.id === currentPkg?.id ? 'border border-purple-500' : ''}"
             onclick="selectPackage(${i})">
          <div class="font-semibold">${pkg.name}</div>
          <div class="text-xs text-gray-400">${pkg.author || '未知'} · ${pkg.tasks?.length || 0}个任务</div>
          ${pkg.id === 'default' ? '<span class="text-xs text-purple-400">内置</span>' : ''}
        </div>
      `).join('');
    }

    function selectPackage(index) {
      currentPkg = packages[index];
      document.getElementById('no-selection').classList.add('hidden');
      document.getElementById('editor-form').classList.remove('hidden');
      document.getElementById('pkg-name').value = currentPkg.name;
      document.getElementById('pkg-author').value = currentPkg.author || '';
      document.getElementById('pkg-desc').value = currentPkg.description || '';
      document.getElementById('pkg-count').value = currentPkg.tasks?.length || 0;
      renderTaskList();
      renderPackageList();
    }

    function renderTaskList() {
      const list = document.getElementById('task-list');
      if (!currentPkg?.tasks) {
        list.innerHTML = '<div class="text-gray-400 text-center py-4">暂无任务</div>';
        return;
      }
      list.innerHTML = currentPkg.tasks.map((task, i) => `
        <div class="p-3 rounded-lg bg-gray-900 flex items-center gap-3">
          <span class="text-xs text-gray-500 w-6">${i + 1}</span>
          <span class="flex-1 truncate">${task.content || task.challenge || task.luck || '任务'}</span>
          <span class="text-xs px-2 py-1 rounded bg-${getTaskTypeColor(task.type)}-600">${getTaskTypeName(task.type)}</span>
          <button onclick="editTask(${i})" class="text-blue-400 text-sm">编辑</button>
          <button onclick="deleteTask(${i})" class="text-red-400 text-sm">删除</button>
        </div>
      `).join('');
      document.getElementById('pkg-count').value = currentPkg.tasks.length;
    }

    function getTaskTypeColor(type) {
      const map = { question: 'blue', action: 'green', challenge: 'yellow', luck: 'purple' };
      return map[type] || 'gray';
    }

    function getTaskTypeName(type) {
      const map = { question: '问答', action: '动作', challenge: '挑战', luck: '运气' };
      return map[type] || type;
    }

    function createNewPackage() {
      const name = prompt('输入任务包名称：');
      if (!name) return;
      currentPkg = {
        id: 'pkg_' + Date.now(),
        name: name,
        author: '',
        description: '',
        tasks: []
      };
      packages.push(currentPkg);
      renderPackageList();
      selectPackage(packages.length - 1);
    }

    function addTask() {
      if (!currentPkg) return;
      currentTaskIndex = currentPkg.tasks.length;
      currentPkg.tasks.push({
        type: 'question',
        content: '',
        options: ['A', 'B', 'C', 'D'],
        answer: 0,
        reward: 2,
        penalty: -2
      });
      renderTaskList();
      editTask(currentPkg.tasks.length - 1);
    }

    function editTask(index) {
      currentTaskIndex = index;
      const task = currentPkg.tasks[index];

      document.getElementById('task-type').value = task.type;
      document.getElementById('task-content').value = task.content || '';
      document.getElementById('task-options').value = (task.options || []).join('|');
      document.getElementById('task-answer').value = task.answer || 0;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-reward').value = task.reward || 2;
      document.getElementById('task-penalty').value = task.penalty || -2;

      updateTaskModalFields();
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function updateTaskModalFields() {
      const type = document.getElementById('task-type').value;
      document.getElementById('options-section').classList.toggle('hidden', type !== 'question');
      document.getElementById('answer-section').classList.toggle('hidden', type !== 'question');
      document.getElementById('desc-section').classList.toggle('hidden', type !== 'action');
    }

    document.getElementById('task-type').addEventListener('change', updateTaskModalFields);

    function saveTask() {
      const task = currentPkg.tasks[currentTaskIndex];
      task.type = document.getElementById('task-type').value;
      task.content = document.getElementById('task-content').value;
      task.options = document.getElementById('task-options').value.split('|').map(s => s.trim()).filter(Boolean);
      task.answer = parseInt(document.getElementById('task-answer').value) || 0;
      task.description = document.getElementById('task-desc').value;
      task.reward = parseInt(document.getElementById('task-reward').value) || 2;
      task.penalty = parseInt(document.getElementById('task-penalty').value) || -2;

      closeTaskModal();
      renderTaskList();
    }

    function deleteTask(index) {
      if (!confirm('确定删除这个任务？')) return;
      currentPkg.tasks.splice(index, 1);
      renderTaskList();
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    async function savePackage() {
      if (!currentPkg || currentPkg.id === 'default') {
        showToast('内置任务包不能修改');
        return;
      }

      currentPkg.name = document.getElementById('pkg-name').value;
      currentPkg.author = document.getElementById('pkg-author').value;
      currentPkg.description = document.getElementById('pkg-desc').value;

      const res = await fetch('/api/task-packages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentPkg)
      });
      const data = await res.json();
      if (data.success) {
        currentPkg.id = data.id;
        showToast('保存成功');
        loadPackages();
      } else {
        showToast('保存失败');
      }
    }

    async function deletePackage() {
      if (!currentPkg || currentPkg.id === 'default') {
        showToast('内置任务包不能删除');
        return;
      }
      if (!confirm('确定删除这个任务包？')) return;
      // 重新加载后端存储
      showToast('功能开发中');
    }

    function showImport() {
      document.getElementById('import-json').value = '';
      document.getElementById('import-modal').classList.remove('hidden');
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }

    async function doImport() {
      const json = document.getElementById('import-json').value;
      if (!json) return;

      const res = await fetch('/api/task-packages/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ json })
      });
      const data = await res.json();
      if (data.success) {
        showToast('导入成功');
        closeImportModal();
        loadPackages();
      } else {
        showToast(data.error || '导入失败');
      }
    }

    function exportCurrent() {
      if (!currentPkg) return;
      const json = JSON.stringify(currentPkg, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `task-package-${currentPkg.name}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2000);
    }

    loadPackages();
  </script>
</body>
</html>
